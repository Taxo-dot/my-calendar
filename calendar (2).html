<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --accent: #5A82A8;
    --accent-light: #E8EEF3;
    --accent-dot: #8FA6BD;
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --border: #E7E5DE;
    --text-primary: #2B2B29;
    --text-secondary: #767469;
    --text-muted: #A3A199;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 76px;
    -webkit-tap-highlight-color: transparent;
  }

  .event-card, .agenda-event {
    font-family: inherit;
    background: var(--card);
  }
  /* Header */
  .header {
    padding: 20px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .header.compact { padding: 10px 20px 4px; }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-label {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .nav-btns { display: flex; gap: 4px; }
  .nav-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
  }
  .nav-btn:active { background: var(--accent-light); }

  /* View switcher (bottom tab bar) */
  .view-switch {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: var(--card);
    border-top: 0.5px solid var(--border);
    padding: 6px 14px calc(6px + env(safe-area-inset-bottom, 0px));
    gap: 4px;
    z-index: 20;
  }
  .view-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 6px 0;
    font-size: 12px;
    color: var(--text-muted);
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .view-btn.active {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
  }

  .content { padding: 4px 20px 0; }

  /* ---- MONTH VIEW ---- */
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin: 18px 0 6px;
  }
  .weekday-row span {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
  }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    row-gap: 2px;
  }
  .day-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-primary);
    position: relative;
    cursor: pointer;
  }
  .day-cell.other-month { color: var(--text-muted); opacity: 0.4; }
  .day-cell .num {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .day-cell.today .num { background: var(--accent); color: #fff; font-weight: 600; }
  .day-cell.selected:not(.today) .num { background: var(--accent-light); }
  .dot-row { display: flex; gap: 2px; height: 4px; margin-top: 2px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-dot); }

  /* Day agenda under month view */
  .agenda-section { margin-top: 20px; }
  .agenda-date {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .event-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .event-bar { width: 3px; height: 30px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .event-bar.alt { background: var(--accent-dot); }
  .event-title { font-size: 14px; font-weight: 500; }
  .event-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .empty-state {
    text-align: center;
    padding: 24px 0;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---- WEEK VIEW ---- */
  .week-header {
    display: grid;
    grid-template-columns: 44px repeat(7, 1fr);
    margin: 18px 0 4px;
  }
  .week-header .wd {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
  }
  .week-header .wd .wnum {
    display: block;
    font-size: 14px;
    color: var(--text-primary);
    width: 26px; height: 26px;
    line-height: 26px;
    border-radius: 50%;
    margin: 3px auto 0;
  }
  .week-header .wd.today .wnum { background: var(--accent); color: #fff; font-weight: 600; }
  .week-grid-wrap { max-height: 420px; overflow-y: auto; border-top: 0.5px solid var(--border); }
  .week-grid {
    display: grid;
    grid-template-columns: 44px repeat(7, 1fr);
  }
  .hour-label {
    font-size: 10px;
    color: var(--text-muted);
    text-align: right;
    padding-right: 6px;
    transform: translateY(-5px);
  }
  .hour-cell {
    border-bottom: 0.5px solid var(--border);
    border-left: 0.5px solid var(--border);
    height: 44px;
    position: relative;
  }
  .week-event {
    position: absolute;
    left: 2px; right: 2px;
    background: var(--accent-light);
    border-left: 2px solid var(--accent);
    border-radius: 4px;
    font-size: 10px;
    color: var(--accent);
    padding: 2px 4px;
    overflow: hidden;
  }

  /* ---- DAY VIEW → continuous agenda list ---- */
  .agenda-list-wrap { padding-top: 10px; }
  .agenda-day-block {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .agenda-day-badge {
    text-align: center;
    padding-top: 2px;
  }
  .agenda-day-badge .wd {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }
  .agenda-day-badge .num {
    font-size: 17px;
    font-weight: 500;
    color: var(--text-primary);
    width: 30px; height: 30px;
    line-height: 30px;
    border-radius: 50%;
    margin: 2px auto 0;
  }
  .agenda-day-badge.today .num { background: var(--accent); color: #fff; }
  .agenda-day-events { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
  .agenda-event {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    text-align: left;
  }
  .agenda-event .bar { width: 3px; height: 26px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .agenda-event.alt .bar { background: var(--accent-dot); }
  .agenda-event .et { font-size: 13px; font-weight: 500; }
  .agenda-event .es { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .agenda-day-empty { font-size: 12px; color: var(--text-muted); padding-top: 4px; }

  /* Event detail sheet */
  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
  .detail-date { font-size: 13px; color: var(--text-secondary); }
  .detail-title { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .detail-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 0.5px solid var(--border); font-size: 14px; }
  .detail-row .di { width: 18px; text-align: center; color: var(--text-muted); font-size: 15px; }

  /* FAB */
  .fab {
    position: fixed;
    bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    max-width: 480px;
    width: calc(100% - 40px);
    display: flex;
    justify-content: flex-end;
    z-index: 19;
  }
  .fab button {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 22px;
    box-shadow: 0 0 0 0.5px var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30,30,28,0.35);
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-radius: 18px 18px 0 0;
    padding: 20px 20px 28px;
  }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text-primary);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .modal-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-cancel { background: var(--bg); color: var(--text-secondary); border: 0.5px solid var(--border) !important; }
  .btn-save { background: var(--accent); color: #fff; font-weight: 500; }
  .error-text { font-size: 12px; color: #A32D2D; margin-top: 4px; display: none; }

  .sync-note {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    padding: 14px 20px 0;
  }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-dot); flex-shrink: 0; }
  .sync-dot.on { background: #4C9A6A; }
</style>
</head>
<body>

<div class="header" id="headerEl">
  <div class="header-top">
    <button class="nav-btn" id="prevBtn" aria-label="前へ">‹</button>
    <span class="month-label" id="monthLabel">2026年8月</span>
    <button class="nav-btn" id="nextBtn" aria-label="次へ">›</button>
  </div>
</div>

<div class="content">
  <!-- MONTH VIEW -->
  <div id="monthView">
    <div class="weekday-row">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="month-grid" id="monthGrid"></div>

    <div class="agenda-section">
      <p class="agenda-date" id="agendaDateLabel">8月21日の予定</p>
      <div id="agendaList"></div>
    </div>
  </div>

  <!-- WEEK VIEW -->
  <div id="weekView" style="display:none;">
    <div class="week-header" id="weekHeader"></div>
    <div class="week-grid-wrap">
      <div class="week-grid" id="weekGrid"></div>
    </div>
  </div>

  <!-- DAY VIEW (continuous agenda list) -->
  <div id="dayView" style="display:none;">
    <div class="agenda-list-wrap" id="agendaListWrap"></div>
  </div>
</div>

<div class="sync-note" id="syncNote">
  <span class="sync-dot"></span>
  <span id="syncText">Googleカレンダーと未連携</span>
  <button id="syncBtn" style="margin-left:auto;background:none;border:none;color:var(--accent);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;">連携する</button>
</div>

<div class="fab">
  <button id="addBtn" aria-label="予定を追加">+</button>
</div>

<nav class="view-switch">
  <button class="view-btn active" data-view="month">月</button>
  <button class="view-btn" data-view="week">週</button>
  <button class="view-btn" data-view="day">日</button>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <p class="modal-title">予定を追加</p>
    <div class="field">
      <label for="evTitle">タイトル</label>
      <input type="text" id="evTitle" placeholder="例: 舞台稽古">
      <p class="error-text" id="titleError">タイトルを入力してください</p>
    </div>
    <div class="field">
      <label for="evDate">日付</label>
      <input type="date" id="evDate">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="evStart">開始時刻</label>
        <input type="time" id="evStart" value="10:00">
      </div>
      <div class="field">
        <label for="evEnd">終了時刻</label>
        <input type="time" id="evEnd" value="11:00">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">キャンセル</button>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailOverlay">
  <div class="modal-sheet">
    <div class="detail-header">
      <div>
        <p class="detail-date" id="detailDate">8月21日(金)</p>
        <p class="detail-title" id="detailTitle">舞台稽古</p>
      </div>
      <button class="nav-btn" id="detailCloseBtn" aria-label="閉じる">✕</button>
    </div>
    <div class="detail-row"><span class="di">⏱</span><span id="detailTime">19:00–21:00</span></div>
  </div>
</div>

<script>
// ---------- State ----------
let today = new Date(2026, 7, 21); // 2026-08-21
let viewMonth = new Date(today.getFullYear(), today.getMonth(), 1);
let selectedDate = new Date(today);
let currentView = 'month';

let events = [
  { title: '舞台稽古', date: '2026-08-21', start: '19:00', end: '21:00' },
  { title: '採用部シフト', date: '2026-08-21', start: '10:00', end: '15:00' },
  { title: '台本読み合わせ', date: '2026-08-24', start: '13:00', end: '15:00' },
  { title: '友人と食事', date: '2026-08-27', start: '18:30', end: '20:30' },
];

const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const weekdayJ = ['日','月','火','水','木','金','土'];

function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function eventsOn(dateStr) {
  return events.filter(e => e.date === dateStr).sort((a,b)=>a.start.localeCompare(b.start));
}

// ---------- Month view ----------
function renderMonth() {
  document.getElementById('monthLabel').textContent = `${viewMonth.getFullYear()}年${monthNames[viewMonth.getMonth()]}`;
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';

  const firstDay = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0).getDate();
  const prevMonthDays = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 0).getDate();

  const cells = [];
  for (let i = startOffset - 1; i >= 0; i--) {
    cells.push({ day: prevMonthDays - i, other: true, date: new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, prevMonthDays - i) });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, other: false, date: new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d) });
  }
  while (cells.length % 7 !== 0 || cells.length < 42) {
    const nextIdx = cells.length - (startOffset + daysInMonth) + 1;
    cells.push({ day: nextIdx, other: true, date: new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, nextIdx) });
    if (cells.length >= 42) break;
  }

  cells.forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (c.other ? ' other-month' : '');
    const dstr = fmtDate(c.date);
    if (fmtDate(c.date) === fmtDate(today)) cell.classList.add('today');
    if (fmtDate(c.date) === fmtDate(selectedDate)) cell.classList.add('selected');

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = c.day;
    cell.appendChild(num);

    const evs = eventsOn(dstr);
    if (evs.length) {
      const dotRow = document.createElement('div');
      dotRow.className = 'dot-row';
      evs.slice(0,3).forEach(() => {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dotRow.appendChild(dot);
      });
      cell.appendChild(dotRow);
    }

    cell.addEventListener('click', () => {
      selectedDate = c.date;
      if (c.other) { viewMonth = new Date(c.date.getFullYear(), c.date.getMonth(), 1); }
      renderMonth();
    });
    grid.appendChild(cell);
  });

  renderAgenda();
}

function renderAgenda() {
  document.getElementById('agendaDateLabel').textContent =
    `${selectedDate.getMonth()+1}月${selectedDate.getDate()}日の予定`;
  const list = document.getElementById('agendaList');
  list.innerHTML = '';
  const evs = eventsOn(fmtDate(selectedDate));
  if (!evs.length) {
    list.innerHTML = '<p class="empty-state">予定はありません</p>';
    return;
  }
  evs.forEach((e, i) => {
    const card = document.createElement('button');
    card.className = 'event-card';
    card.style.width = '100%';
    card.style.border = '0.5px solid var(--border)';
    card.style.textAlign = 'left';
    card.style.cursor = 'pointer';
    card.innerHTML = `
      <div class="event-bar${i % 2 ? ' alt' : ''}"></div>
      <div>
        <div class="event-title">${escapeHtml(e.title)}</div>
        <div class="event-time">${e.start}–${e.end}</div>
      </div>`;
    card.addEventListener('click', () => showEventDetail(e, selectedDate));
    list.appendChild(card);
  });
}

// ---------- Week view ----------
function startOfWeek(d) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() - dt.getDay());
  return dt;
}
function renderWeek() {
  const start = startOfWeek(selectedDate);
  document.getElementById('monthLabel').textContent =
    `${start.getMonth()+1}月${start.getDate()}日〜`;

  const header = document.getElementById('weekHeader');
  header.innerHTML = '<div></div>';
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    days.push(d);
    const wd = document.createElement('div');
    wd.className = 'wd' + (fmtDate(d) === fmtDate(today) ? ' today' : '');
    wd.innerHTML = `${weekdayJ[d.getDay()]}<span class="wnum">${d.getDate()}</span>`;
    header.appendChild(wd);
  }

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  for (let h = 6; h <= 22; h++) {
    const label = document.createElement('div');
    label.className = 'hour-label';
    label.textContent = h + ':00';
    grid.appendChild(label);
    for (let i = 0; i < 7; i++) {
      const cell = document.createElement('div');
      cell.className = 'hour-cell';
      const dstr = fmtDate(days[i]);
      eventsOn(dstr).forEach(e => {
        const sh = parseInt(e.start.split(':')[0]);
        const sm = parseInt(e.start.split(':')[1]);
        const eh = parseInt(e.end.split(':')[0]);
        const em = parseInt(e.end.split(':')[1]);
        if (sh === h) {
          const durMin = (eh*60+em) - (sh*60+sm);
          const ev = document.createElement('div');
          ev.className = 'week-event';
          ev.style.top = (sm/60*44) + 'px';
          ev.style.height = Math.max(durMin/60*44 - 2, 14) + 'px';
          ev.textContent = e.title;
          cell.appendChild(ev);
        }
      });
      grid.appendChild(cell);
    }
  }
}

// ---------- Continuous agenda list (was day view) ----------
function renderAgendaList() {
  const wrap = document.getElementById('agendaListWrap');
  wrap.innerHTML = '';
  const rangeDays = 21;

  for (let i = 0; i < rangeDays; i++) {
    const d = new Date(selectedDate);
    d.setDate(d.getDate() + i);
    const dstr = fmtDate(d);
    const evs = eventsOn(dstr);

    const block = document.createElement('div');
    block.className = 'agenda-day-block';

    const badge = document.createElement('div');
    badge.className = 'agenda-day-badge' + (dstr === fmtDate(today) ? ' today' : '');
    badge.innerHTML = `<div class="wd">${weekdayJ[d.getDay()]}</div><div class="num">${d.getDate()}</div>`;
    block.appendChild(badge);

    const list = document.createElement('div');
    list.className = 'agenda-day-events';
    if (!evs.length) {
      list.innerHTML = '<div class="agenda-day-empty">予定なし</div>';
    } else {
      evs.forEach((e, idx) => {
        const item = document.createElement('button');
        item.className = 'agenda-event' + (idx % 2 ? ' alt' : '');
        item.innerHTML = `
          <div class="bar"></div>
          <div>
            <div class="et">${escapeHtml(e.title)}</div>
            <div class="es">${e.start}–${e.end}</div>
          </div>`;
        item.addEventListener('click', () => showEventDetail(e, d));
        list.appendChild(item);
      });
    }
    block.appendChild(list);
    wrap.appendChild(block);
  }
}

// ---------- Event detail sheet ----------
const detailOverlay = document.getElementById('detailOverlay');
function showEventDetail(e, dateObj) {
  document.getElementById('detailDate').textContent =
    `${dateObj.getMonth()+1}月${dateObj.getDate()}日(${weekdayJ[dateObj.getDay()]})`;
  document.getElementById('detailTitle').textContent = e.title;
  document.getElementById('detailTime').textContent = `${e.start}–${e.end}`;
  detailOverlay.classList.add('open');
}
document.getElementById('detailCloseBtn').addEventListener('click', () => detailOverlay.classList.remove('open'));
detailOverlay.addEventListener('click', (ev) => { if (ev.target === detailOverlay) detailOverlay.classList.remove('open'); });

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ---------- View switching ----------
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('monthView').style.display = view === 'month' ? '' : 'none';
  document.getElementById('weekView').style.display = view === 'week' ? '' : 'none';
  document.getElementById('dayView').style.display = view === 'day' ? '' : 'none';
  document.querySelector('.header-top').style.display = view === 'day' ? 'none' : 'flex';
  document.getElementById('headerEl').classList.toggle('compact', view === 'day');
  if (view === 'month') renderMonth();
  if (view === 'week') renderWeek();
  if (view === 'day') renderAgendaList();
}
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

// ---------- Nav ----------
document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentView === 'month') { viewMonth.setMonth(viewMonth.getMonth() - 1); renderMonth(); }
  else if (currentView === 'week') { selectedDate.setDate(selectedDate.getDate() - 7); renderWeek(); }
  else { selectedDate.setDate(selectedDate.getDate() - 7); renderAgendaList(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentView === 'month') { viewMonth.setMonth(viewMonth.getMonth() + 1); renderMonth(); }
  else if (currentView === 'week') { selectedDate.setDate(selectedDate.getDate() + 7); renderWeek(); }
  else { selectedDate.setDate(selectedDate.getDate() + 7); renderAgendaList(); }
});

// ---------- Add event modal ----------
const overlay = document.getElementById('modalOverlay');
document.getElementById('addBtn').addEventListener('click', () => {
  document.getElementById('evTitle').value = '';
  document.getElementById('evDate').value = fmtDate(selectedDate);
  document.getElementById('titleError').style.display = 'none';
  overlay.classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('saveBtn').addEventListener('click', () => {
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value;
  const start = document.getElementById('evStart').value;
  const end = document.getElementById('evEnd').value;
  const errorEl = document.getElementById('titleError');

  if (!title) {
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';

  events.push({ title, date, start, end });
  overlay.classList.remove('open');
  selectedDate = new Date(date + 'T00:00:00');
  viewMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
  switchView(currentView);
});
document.getElementById('evTitle').addEventListener('input', () => {
  document.getElementById('titleError').style.display = 'none';
});

// ---------- Google Calendar sync (read-only) ----------
const GOOGLE_CLIENT_ID = '11963480922-suklrfuitj63j6311plsefu200h7amgn.apps.googleusercontent.com';
const GOOGLE_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
let tokenClient = null;
let googleAccessToken = null;

function initGoogleAuth() {
  if (typeof google === 'undefined' || !google.accounts) {
    setTimeout(initGoogleAuth, 300);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        googleAccessToken = resp.access_token;
        fetchGoogleEvents();
      }
    }
  });
}

function setSyncStatus(text, connected) {
  document.getElementById('syncText').textContent = text;
  document.querySelector('.sync-dot').classList.toggle('on', !!connected);
}

async function fetchGoogleEvents() {
  setSyncStatus('同期中…', true);
  const timeMin = new Date();
  timeMin.setDate(timeMin.getDate() - 14);
  const timeMax = new Date();
  timeMax.setDate(timeMax.getDate() + 60);

  try {
    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?` +
      `timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}` +
      `&singleEvents=true&orderBy=startTime&maxResults=250`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${googleAccessToken}` } });
    if (!res.ok) throw new Error('API error: ' + res.status);
    const data = await res.json();

    // remove previously imported google events, then re-add fresh ones
    events = events.filter(e => e.source !== 'google');

    (data.items || []).forEach(item => {
      if (!item.summary) return;
      let date, start, end;
      if (item.start.dateTime) {
        const s = new Date(item.start.dateTime);
        const e = new Date(item.end.dateTime);
        date = fmtDate(s);
        start = String(s.getHours()).padStart(2,'0') + ':' + String(s.getMinutes()).padStart(2,'0');
        end = String(e.getHours()).padStart(2,'0') + ':' + String(e.getMinutes()).padStart(2,'0');
      } else {
        date = item.start.date;
        start = '終日';
        end = '';
      }
      events.push({ title: item.summary, date, start, end, source: 'google' });
    });

    setSyncStatus('Googleカレンダーと連携済み', true);
    document.getElementById('syncBtn').textContent = '再同期';
    switchView(currentView);
  } catch (err) {
    setSyncStatus('同期に失敗しました。もう一度お試しください', false);
    console.error(err);
  }
}

document.getElementById('syncBtn').addEventListener('click', () => {
  if (!tokenClient) return;
  tokenClient.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
});
initGoogleAuth();

// ---------- Init ----------
renderMonth();
</script>
